const id = new URLSearchParams(location.search).get('id') || 'p1';

document.title = p.title + ' · BlueCodeFlow';
document.getElementById('post-body').innerHTML = `
<div class="post-meta-top" style="margin-bottom:14px"><span class="cat">${p.cat}</span><span>${p.date}</span><span>· ${p.read}阅读</span></div>
<h1>${p.title}</h1>

<h2>1. 前言</h2>
<p>这是「${p.title}」的示例正文页。所有博客共用 <code>post.html?id=xxx</code> 模板，通过 <code>js/data.js</code> 里的 POSTS 数据渲染，天然就是多页面结构。你可以把这里换成真实 Markdown 渲染（如 marked.js）或静态生成。</p>
<pre><code>$ git clone https://github.com/your-name/${id}.git
$ cd ${id} && npm i && npm run dev
# ➜ Local: http://localhost:3000  ✓ blue flow running</code></pre>
<h2>2. 核心思路</h2>
<p>蓝色代码流的关键是三层叠加：深蓝渐变底 + CSS 网格 + Canvas 流动粒子（<code>js/flow.js</code>）。横向光线用渐变描边 + 阴影发光，纵向代码雨用低透明度重绘形成拖尾，性能稳定 60fps。</p>

<pre><code>if (you.likeIt) { star(); fork(); share(); }</code></pre>
